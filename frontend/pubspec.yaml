name: qflow
description: Mon Rendez-vous Qflow — Queue & Medical appointment app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3
  socket_io_client: ^3.1.4
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  intl: ^0.19.0
  pretty_dio_logger: ^1.3.1
  flutter_animate: ^4.5.0
  provider: ^6.1.2
  badges: ^3.1.2
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  file_picker: 8.1.7
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  path_provider_android: 2.2.22
  path_provider_foundation: 2.5.1


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
